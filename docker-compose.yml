services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: elovate
      POSTGRES_USER: elovate
      POSTGRES_PASSWORD: elovate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elovate -d elovate"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  flyway:
    image: flyway/flyway:10-alpine
    network_mode: "service:postgres"
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://localhost:5432/elovate
      FLYWAY_USER: elovate
      FLYWAY_PASSWORD: elovate
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./migrations:/flyway/migrations
    depends_on:
      postgres:
        condition: service_healthy
