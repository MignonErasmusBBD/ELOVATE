<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Elovate icon on coral</title>
  <desc>Rounded square icon with coral background showing an ascending line chart with five points, dipping once before climbing to a filled peak dot.</desc>

  <rect x="8" y="8" width="496" height="496" rx="108" fill="#FF6B4A"/>

  <polyline points="122,356 202,314 282,330 352,248 426,180" fill="none" stroke="#1E1B33" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="122" cy="356" r="16" fill="#FFFFFF"/>
  <circle cx="202" cy="314" r="16" fill="#FFFFFF"/>
  <circle cx="282" cy="330" r="16" fill="#FFFFFF"/>
  <circle cx="352" cy="248" r="16" fill="#FFFFFF"/>
  <circle cx="426" cy="180" r="22" fill="#1E1B33"/>
</svg>
